name: Release Chaffinch
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, file: chaffinch }
          - { os: windows-latest, target: windows-x64, file: chaffinch.exe }
          - { os: macos-latest, target: macos-arm64, file: chaffinch }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --locked --git https://github.com/Rahulchaube1/blyxxxx --rev 120d6b6ec6df09ff018d7c18752fb3297b5e629d blyxc
      - run: blyxc native-run tests.blyx
      - run: blyxc native-run scale_example.blyx
      - name: Build and package the native command
        shell: bash
        run: |
          mkdir -p stage dist
          blyxc build project.blyx -o stage/${{ matrix.file }}
          cp *.blyx Blyx.toml README.md SCALE.md LICENSE-* stage/
          if [[ -d fixtures ]]; then cp -r fixtures stage/; fi
          cd stage
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a ../dist/chaffinch-${{ matrix.target }}.zip *
          else
            tar -czf ../dist/chaffinch-${{ matrix.target }}.tar.gz *
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chaffinch-${{ matrix.target }}
          path: dist/*
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Package the editor and source starter
        shell: bash
        run: |
          set -eu
          version=$(jq -r .version editor/package.json)
          mkdir -p dist
          (cd editor && npx --yes @vscode/vsce@4.1.1 package --no-dependencies --out "../dist/blyx-chaffinch-$version.vsix")
          (cd editor/starter && zip -qr "../../dist/blyx-chaffinch-starter-$version.zip" .)
          unzip -t "dist/blyx-chaffinch-$version.vsix"
          unzip -p "dist/blyx-chaffinch-$version.vsix" extension/logo.png | cmp - editor/logo.png
      - uses: actions/upload-artifact@v4
        with:
          name: blyx-chaffinch-editor
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, editor]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum *.tar.gz *.zip *.vsix > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Merge sorted sparse gradient sums from two workers, coalesce duplicate coordinates and normalize by the global example count.
            [Release guide](https://github.com/Rahulchaube1/blyx-chaffinch/blob/v0.2.0/SCALE.md) · [Study and raw data](https://www.blyx-lang.space/articles/training-in-factors)
